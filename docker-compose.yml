
services:
  neo4j:
    image: neo4j:5.15.0
    container_name: recommend-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-recommend_neo4j_2024}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/init:/var/lib/neo4j/import
    networks:
      - recommend-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-recommend_neo4j_2024} 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 10

  # NOTE: Ollama runs as a host systemd service (port 11434 on host).
  # Containers reach it via host-gateway (172.17.0.1 / host.docker.internal).
  # Run: ollama pull llama3.2:1b   — on your host terminal once.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recommend-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-recommend_neo4j_2024}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:1b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - CHROMA_PATH=/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"   # maps to 172.17.0.1 (host)
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - recommend-network
    volumes:
      - ./backend:/app
      - ./software_knowledge_graph_data.csv:/app/software_knowledge_graph_data.csv
      - chroma_data:/app/chroma_db
      - ./neo4j/init:/app/neo4j/init:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recommend-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - recommend-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  recommend-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  chroma_data:    # Persists the ChromaDB vector index across container restarts
